<!DOCTYPE html>
<html>
<head>
    <title>Image Debug</title>
</head>
<body>
    <h2>Image Test</h2>

    <!-- Your image -->
    <img id="testImg" src="sorkin_desk260.jpg" alt="Sorkin at his desk" width="260">

    <!-- Debug message -->
    <p id="debugMsg"></p>

    <script>
        const img = document.getElementById('testImg');
        const msg = document.getElementById('debugMsg');

        img.onerror = function() {
            msg.textContent = "⚠️ Image failed to load. Check the file name, extension, and path!";
            msg.style.color = "red";
        }

        img.onload = function() {
            msg.textContent = "✅ Image loaded successfully!";
            msg.style.color = "green";
        }
    </script>
</body>
</html>
